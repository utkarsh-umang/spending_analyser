expense_rules: |
  Merchant keyword matches (category_merchants in this file) are authoritative when they apply.
  Quick Commerce: Blinkit, Zepto, Swiggy Instamart, Dunzo — not restaurant food orders on Swiggy/Zomato (those are Food and Dining).
  Online Shopping: Flipkart, Amazon, and general e-commerce marketplaces.
  Fashion and Lifestyle: H&M, Zara, clothing, fashion, jewellery stores — not Amazon/Flipkart unless clearly fashion-only merchant name.
  Travel - Flights: MakeMyTrip, Cleartrip, Goibibo, airline names.
  Travel - Trains: IRCTC only.
  UPI / IMPS with a known payee in payee memory: use that category.
  UPI with a clear merchant keyword (Amazon, Zomato, etc.): use category_merchants.
  UPI with no identifiable payee/merchant: amount rules in upi_amount_rules apply automatically.
  Named P2P transfers to people (payee known): use payee memory or mark uncertain if unknown.

income_rules: |
  - Large employer salary/payroll credits → Salary.
  - Merchant refunds and chargebacks → Refunds; card/UPI rewards → Cashback.
  - Credit card bill payments (from bank to settle card) → Credit Card Payment — NOT real income.
  - Account-to-account transfers → Internal Transfer — NOT real income.
  - Small credits under ₹10,000 are rarely Salary — mark uncertain unless description clearly says salary/payroll.
  - P2P credits from people: mark uncertain if payee not in payee memory.
  - On credit card statements, a credit is almost always bill payment or refund — never Salary.
