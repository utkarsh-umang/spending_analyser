# Expense (debit) and income (credit) categories — edit freely.
# category_merchants: auto-match when description contains any keyword (case-insensitive).
# UPI payments to people are resolved via config/payees/*.json (learned in HITL).

expense_categories:
  - Quick Commerce
  - Online Shopping
  - Fashion and Lifestyle
  - Food and Dining
  - Groceries
  - Local Transport
  - Travel - Flights
  - Travel - Trains
  - Utilities
  - Rent
  - Healthcare
  - Entertainment
  - Subscriptions
  - Insurance
  - Education
  - Personal Care
  - Gifts to Family
  - Family Transfer
  - Roommate and Shared Expenses
  - Transfers to Known People
  - Investments
  - Credit Card Payment
  - Offline Shopping
  - GMAT
  - Other

income_categories:
  - Salary
  - Refunds
  - Cashback
  - Interest
  - Dividends
  - Rental Income
  - Credit Card Payment
  - Internal Transfer
  - Other Income

# Credits on credit card statements — HITL/LLM use this short list first
credit_card_income_categories:
  - Credit Card Payment
  - Refunds
  - Cashback

# Categories with counts_as_income: false are excluded from income/savings totals in analysis
category_flags:
  Credit Card Payment:
    counts_as_income: false
  Internal Transfer:
    counts_as_income: false

income_salary_min_amount: 10000

# UPI debits with no clear merchant/payee — classify by amount (see upi_amount_rules.py)
upi_amount_rules:
  enabled: true
  exact_amounts:
    50000: GMAT
  ranges:
    - max: 200
      category: Local Transport
    - min: 200
      max: 1000
      category: Offline Shopping
    - min: 1000
      max: 10000
      category: Online Shopping
    - min: 10000
      category: Credit Card Payment

income_merchants:
  Credit Card Payment:
    - payment received
    - autopay
    - auto pay
    - bill payment
    - credit card payment
    - cc payment
    - card payment
    - payment thank you

