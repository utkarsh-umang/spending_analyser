# Statement folders: names containing "card" → credit card; all others → bank.
# Override per account with kind: credit_card | bank if needed.
statements_root: "."
accounts:
  icici_bank:
    label: "ICICI bank"
    path: "ICICI bank"
  icici_card:
    label: "ICICI card"
    path: "ICICI card"
  sbi_bank:
    label: "SBI bank"
    path: "SBI bank"
  sbi_card:
    label: "SBI card"
    path: "SBI card"
